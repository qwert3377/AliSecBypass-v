name: Build AliSecBypass v4
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git $HOME/theos && echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install Dependencies
        run: brew install cmake ldid || true
      - name: Clone and build fishhook
        run: |
          git clone --depth=1 https://github.com/facebook/fishhook.git fishhook
          cd fishhook
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -c fishhook.c -o fishhook.o -arch arm64 -isysroot "$IOS_SDK" -I.
          ar rcs libfishhook.a fishhook.o
          echo "fishhook built"
          file libfishhook.a
        working-directory: ${{ github.workspace }}
      - name: Build Tweak
        run: export THEOS=$HOME/theos && export FISHHOOK_PATH=$(pwd)/fishhook && make clean || true && make package FINALPACKAGE=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliSecBypass_v4-dylib
          path: .theos/obj/AliSecBypass_v4.dylib
