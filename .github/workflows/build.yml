name: Build AliSecBypass v4

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git $HOME/theos && echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install Dependencies
        run: brew install cmake ldid || true

      - name: Clone and build fishhook
        run: |
          git clone --depth=1 https://github.com/facebook/fishhook.git fishhook
          cd fishhook
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -c fishhook.c -o fishhook.o -arch arm64 -isysroot "$IOS_SDK" -I.
          ar rcs libfishhook.a fishhook.o
          echo "fishhook built"
          file libfishhook.a
        working-directory: ${{ github.workspace }}

      - name: Build Dobby via setup.sh
        run: |
          # 先修复 setup.sh 里的 pipes 兼容问题（如果 GitHub Actions Python 版本不同）
          if [ -f "setup.sh" ]; then
            sed -i.bak 's/import pipes/import shlex/g' setup.sh 2>/dev/null || true
            sed -i.bak 's/pipes.quote/shlex.quote/g' setup.sh 2>/dev/null || true
            chmod +x setup.sh
            ./setup.sh
          else
            # 如果没有 setup.sh，手动跑 platform_builder.py
            git clone --depth=1 https://github.com/jmpews/Dobby.git dobby
            cd dobby
            sed -i.bak 's/import pipes/import shlex/g' scripts/platform_builder.py
            sed -i.bak 's/pipes.quote/shlex.quote/g' scripts/platform_builder.py
            python3 scripts/platform_builder.py --platform=iphoneos --arch=arm64
          fi
        working-directory: ${{ github.workspace }}

      - name: Prepare Dobby for build
        run: |
          mkdir -p Dobby/include
          cp $(find . -name "libdobby.a" | head -1) Dobby/ 2>/dev/null || true
          cp $(find . -name "dobby.h" | head -1) Dobby/include/ 2>/dev/null || true
          echo "Dobby prepared:"
          ls -la Dobby/ 2>/dev/null || echo "Dobby dir not found"
          ls -la Dobby/include/ 2>/dev/null || echo "Dobby include not found"
        working-directory: ${{ github.workspace }}

      - name: Build Tweak
        run: export THEOS=$HOME/theos && export FISHHOOK_PATH=$(pwd)/fishhook && make clean || true && make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliSecBypass_v4-dylib
          path: .theos/obj/AliSecBypass_v4.dylib
