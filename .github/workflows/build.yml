name: Build AliSecBypass v4

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          echo "Installing Theos..."
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "Installed Theos at $HOME/theos"

      - name: Install Dependencies
        run: |
          brew install cmake
          pip3 install lief --break-system-packages

      - name: Clone & Build Dobby
        run: |
          echo "Cloning Dobby..."
          git clone --depth=1 https://github.com/jmpews/Dobby.git dobby
          cd dobby
          echo "Building Dobby iOS static library..."
          python3 scripts/platform_builder.py --platform=iphoneos --arch=arm64
          echo "Dobby build done."
          echo "Listing artifacts:"
          find . -name "*.a" -o -name "*.framework" | head -20

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export DOBBY_PATH=$(pwd)/dobby
          echo "DOBBY_PATH=$DOBBY_PATH"
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliSecBypass_v4-dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/**/*.deb
            packages/*.deb
          if-no-files-found: warn

      - name: Upload Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .theos/build.log
          if-no-files-found: ignore
