name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Dobby (iOS cross-compile)
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git dobby
          cd dobby
          mkdir -p build && cd build
          # 用 iOS SDK 交叉编译，避免链接 macOS 对象文件
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IOS_CC=$(xcrun --sdk iphoneos -f clang)
          IOS_CXX=$(xcrun --sdk iphoneos -f clang++)
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_C_COMPILER="$IOS_CC" \
            -DCMAKE_CXX_COMPILER="$IOS_CXX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DDOBBY_BUILD_STATIC_LIBRARY=ON \
            -DDOBBY_BUILD_SHARED_LIBRARY=OFF
          make -j$(sysctl -n hw.ncpu)
          # 验证架构
          echo "=== Dobby library info ==="
          file libdobby.a
          lipo -info libdobby.a || true
          otool -l libdobby.a | grep -E "(LC_BUILD_VERSION|platform)" | head -5 || true
          # 复制到 Makefile 能找到的位置
          cp libdobby.a ../
        working-directory: ${{ github.workspace }}

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make
        working-directory: ${{ github.workspace }}

      - name: Upload dylib only
        uses: actions/upload-artifact@v4
        with:
          name: AliSecBypass_v4-dylib
          path: .theos/obj/AliSecBypass_v4.dylib
          if-no-files-found: error
