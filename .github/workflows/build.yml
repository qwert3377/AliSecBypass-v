name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Dobby
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git dobby
          cd dobby
          mkdir -p build && cd build
          cmake .. -DDOBBY_BUILD_STATIC_LIBRARY=ON -DDOBBY_BUILD_SHARED_LIBRARY=OFF
          make -j$(sysctl -n hw.ncpu)
          # 找到生成的 .a 文件，复制到 dobby/ 根目录，确保 Makefile 的 find 能搜到
          LIB=$(find . -name "*.a" -type f | head -1)
          if [ -z "$LIB" ]; then echo "ERROR: Dobby static library not built!"; exit 1; fi
          cp "$LIB" ../libdobby.a
          echo "Built: $LIB -> ../libdobby.a"
          file ../libdobby.a
        working-directory: ${{ github.workspace }}

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make
        working-directory: ${{ github.workspace }}

      - name: Upload dylib only
        uses: actions/upload-artifact@v4
        with:
          name: AliSecBypass_v4-dylib
          path: .theos/obj/AliSecBypass_v4.dylib
          if-no-files-found: error
