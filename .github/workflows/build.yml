name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Dobby
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git dobby
        working-directory: ${{ github.workspace }}

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make
        working-directory: ${{ github.workspace }}

      - name: Upload dylib only
        uses: actions/upload-artifact@v4
        with:
          name: AliSecBypass_v4-dylib
          path: .theos/obj/AliSecBypass_v4.dylib
          if-no-files-found: error
